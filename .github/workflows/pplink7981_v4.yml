name: Build PPLINK7981 V4 PassWall

# V4 = V3 修正版
# 修正点：
#   1. immortalwrt 的 luci feed 自带 luci-app-passwall(25.12.16)，与 Openwrt-Passwall
#      的 feed 同名冲突，install -a 会装 luci 那份 → 删掉 passwall 主 feed，直接用官方自带版
#   2. 配置项按 25.12.16 的真实 menuconfig 名改写（不存在 Nftables_Transparent_Proxy 等旧开关）
#   3. 编译步骤退出码改用 pipefail 直接取，避免 PIPESTATUS 被 || true 清掉
# 只保留手动触发，不会因 push 自动跑
on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget curl ccache \
            libelf-dev ecj fastjar java-propose-classpath time
          echo "nproc=$(nproc)  mem=$(free -m | awk '/Mem:/{print $2}')MB"

      - name: 克隆源码
        run: |
          git clone --depth=1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt && git log -1 --pretty='%h %s'

      - name: 注入设备
        run: |
          set -e
          cp mt7981b-pplink-7981.dts openwrt/target/linux/mediatek/dts/
          cat pplink-device.mk >> openwrt/target/linux/mediatek/image/filogic.mk
          install -Dm755 99-pplink-network \
            openwrt/target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-pplink-network
          echo "--- 注入结果 ---"
          ls -l openwrt/target/linux/mediatek/dts/mt7981b-pplink-7981.dts
          tail -n 22 openwrt/target/linux/mediatek/image/filogic.mk

      # 不需要加任何第三方 feed：
      #   luci-app-passwall 本体      → immortalwrt 的 luci feed（25.12.16）
      #   chinadns-ng / ipt2socks /   → immortalwrt 的 packages feed
      #   microsocks / dns2socks / tcping / v2ray-geodata
      # 曾经加过 Openwrt-Passwall 的 passwall feed，结果与官方同名冲突，
      # feeds install 只装官方那份，`ls package/feeds/passwall/...` 直接失败。
      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "--- passwall 是否就位 ---"
          ls -d package/feeds/luci/luci-app-passwall
          echo "--- 依赖是否就位 ---"
          for p in chinadns-ng ipt2socks microsocks dns2socks tcping v2ray-geodata; do
            ls -d package/feeds/*/$p 2>/dev/null || echo "MISSING $p"
          done

      - name: 生成配置
        run: |
          set -e
          cd openwrt
          cp ../pplink.config .config
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadow_TLS=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_tuic_client=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geoview=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin=n
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin=n
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y

          # PassWall 的 nftables 透明代理三件套，必须进内核，否则装了也跑不起来
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-inet-diag=y

          # 编出全部内核模块的 ipk（不进镜像，只生成安装包）
          # 以后想把哪个 kmod 装上，直接拿自己这套 ipk 装，不用再重编固件
          CONFIG_ALL_KMODS=y
          EOF
          make defconfig

          echo "--- 设备符号 ---"
          grep -E "CONFIG_TARGET_mediatek_filogic_DEVICE_pplink_7981" .config || true
          echo "--- PassWall 与内核模块 ---"
          grep -E "CONFIG_PACKAGE_(luci-app-passwall|kmod-nft-tproxy|kmod-nft-socket|kmod-nft-nat|kmod-inet-diag|ipt2socks|chinadns-ng|microsocks|dns2socks|tcping)=" .config || true

          grep -q "CONFIG_TARGET_mediatek_filogic_DEVICE_pplink_7981=y" .config || {
            echo "::error::设备符号没生成，检查 filogic.mk 注入"; exit 1; }
          grep -q "CONFIG_PACKAGE_luci-app-passwall=y" .config || {
            echo "::error::PassWall 没选上，检查 feed 是否装上"; exit 1; }
          grep -q "CONFIG_PACKAGE_kmod-nft-tproxy=y" .config || {
            echo "::error::kmod-nft-tproxy 没被 select，PassWall 装了也跑不了"; exit 1; }
          grep -q "CONFIG_PACKAGE_kmod-nft-socket=y" .config || {
            echo "::error::kmod-nft-socket 没被 select"; exit 1; }

      # Xray 用官方预编译二进制，避免在 2 核 runner 上编 Go（极慢且易 OOM）
      - name: 预置 Xray 核心
        run: |
          set -e
          mkdir -p openwrt/files/usr/bin
          curl -fL --retry 3 -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-arm64-v8a.zip
          unzip -o /tmp/xray.zip xray -d openwrt/files/usr/bin/
          chmod 755 openwrt/files/usr/bin/xray
          ls -lh openwrt/files/usr/bin/xray

      # 先预下载所有包源码（最容易卡网络），单独成步便于定位
      # 注意：绝对不能接 `| tail -n N`，tail 不带 -f 会读到 EOF 才输出，页面一片空白
      - name: 预下载源码包
        run: |
          cd openwrt
          make -j1 download 2>&1 | tee download.log | grep --line-buffered -E \
            "^(Downloading|--|make\[|WARNING:)"
          echo "=== 下载完成，dl 总大小 ==="
          du -sh dl || true

      - name: 编译
        run: |
          cd openwrt
          set -o pipefail
          START=$(date +%s)

          (
            while true; do
              sleep 180
              NOW=$(date +%s)
              echo "----- [心跳] 已编译 $(( (NOW-START)/60 ))m  内存 $(free -m | awk '/Mem:/{print $3"MB used / "$7"MB avail"}') -----"
              echo "----- 日志尾部：$(ls -l build.log 2>/dev/null | awk '{print $5" bytes"}') -----"
              tail -n 6 build.log 2>/dev/null | sed 's/^/    /'
            done
          ) &
          HB=$!
          trap "kill $HB 2>/dev/null || true" EXIT

          # grep 无匹配会返回 1，用 { ... || true; } 把它吞掉，只让 make 的退出码生效
          make -j"$(nproc)" V=s 2>&1 | tee build.log | \
            { grep --line-buffered -E "^(make\[[0-9]+\]: (Entering|Leaving) directory|Packaging|Installing|Configuring|Downloading|ERROR|.*Error [0-9])" || true; }
          RC=$?

          echo "=== make 退出码: $RC ==="
          echo "=== 编译耗时: $(( ($(date +%s)-START)/60 )) 分钟 ==="

          if [ "$RC" -ne 0 ]; then
            echo "::error::编译失败，关键错误如下"
            grep -nE "(\*\*\*|error:|Error [0-9]|undefined reference|Duplicate label|ERROR \(|No rule to make|fatal error)" build.log | head -n 250 || true
            tail -n 100 build.log
            exit 1
          fi
          echo "=== 编译成功 ==="
          tail -n 30 build.log

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-v4
          path: |
            openwrt/build.log
            openwrt/download.log
          retention-days: 5
          if-no-files-found: ignore

      - name: 收集产物
        run: |
          mkdir -p out
          find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name "*pplink*" -o -name "*.manifest" -o -name "sha256sums" \) \
            -exec cp {} out/ \;
          ls -lh out
          echo "--- PassWall 是否进包 ---"
          grep -E "^(luci-app-passwall|kmod-nft-tproxy|kmod-nft-socket|kmod-nft-nat|kmod-inet-diag|ipt2socks|chinadns-ng|microsocks|dns2socks|tcping|v2ray-geoip) " out/*.manifest || true

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pplink7981-firmware-v4
          path: out/
          if-no-files-found: error

      # 把自己这套编译产出的 ipk 全量打包，作为「本机专用软件源」
      # 关键：kmod 的 Depends 里写死了 kernel (=6.6.159~a43ef2f9...-r1)，
      # 只有这批 ipk 能装进这台机器，官方源永远对不上
      - name: 打包自建软件源 ipk
        run: |
          set -e
          mkdir -p ipk-repo/kmods
          cp openwrt/bin/targets/mediatek/filogic/packages/*.ipk ipk-repo/kmods/ 2>/dev/null || true
          cp openwrt/bin/targets/mediatek/filogic/packages/Packages* ipk-repo/kmods/ 2>/dev/null || true
          for f in base luci packages routing telephony passwall_packages; do
            if [ -d "openwrt/bin/packages/aarch64_cortex-a53/$f" ]; then
              mkdir -p "ipk-repo/packages/$f"
              cp openwrt/bin/packages/aarch64_cortex-a53/$f/*.ipk "ipk-repo/packages/$f/" 2>/dev/null || true
              cp openwrt/bin/packages/aarch64_cortex-a53/$f/Packages* "ipk-repo/packages/$f/" 2>/dev/null || true
            fi
          done
          echo "=== ipk 仓库规模 ==="
          du -sh ipk-repo
          echo "kmod 数量: $(ls ipk-repo/kmods/*.ipk 2>/dev/null | wc -l)"
          echo "关键包:"
          ls ipk-repo/kmods/ | grep -E "nft-tproxy|nft-socket|inet-diag" || true
          ls ipk-repo/packages/luci/ 2>/dev/null | grep -i passwall || true

      - name: 上传 ipk 仓库
        uses: actions/upload-artifact@v4
        with:
          name: pplink7981-ipk-repo
          path: ipk-repo/
          retention-days: 30
          if-no-files-found: warn

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-v4-${{ github.run_number }}
          name: PPLINK7981 V4 PassWall build ${{ github.run_number }}
          files: out/*
