name: Build PPLINK7981

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget curl ccache \
            libelf-dev ecj fastjar java-propose-classpath time

      - name: 克隆源码
        run: |
          git clone --depth=1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt && git log -1 --pretty='%h %s'

      - name: 注入设备
        run: |
          set -e
          cp mt7981b-pplink-7981.dts openwrt/target/linux/mediatek/dts/
          cat pplink-device.mk >> openwrt/target/linux/mediatek/image/filogic.mk
          install -Dm755 99-pplink-network \
            openwrt/target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-pplink-network
          echo "--- 注入结果 ---"
          ls -l openwrt/target/linux/mediatek/dts/mt7981b-pplink-7981.dts
          tail -n 22 openwrt/target/linux/mediatek/image/filogic.mk

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置
        run: |
          cd openwrt
          cp ../pplink.config .config
          make defconfig
          grep -E "CONFIG_TARGET_mediatek_filogic_DEVICE_pplink_7981|CONFIG_TARGET_ROOTFS_SQUASHFS|CONFIG_PACKAGE_luci=" .config || true
          grep -q "CONFIG_TARGET_mediatek_filogic_DEVICE_pplink_7981=y" .config || {
            echo "::error::设备符号没生成，检查 filogic.mk 注入"; exit 1; }

      - name: 编译
        run: |
          cd openwrt
          if make -j"$(nproc)" V=s > build.log 2>&1; then
            echo "=== 编译成功 ==="
            tail -n 40 build.log
          else
            echo "::error::编译失败，关键错误如下"
            echo ""
            echo "----- 错误行（Error / error: / *** / duplicate label）-----"
            grep -nE "(\*\*\*|error:|Error [0-9]|undefined reference|Duplicate label|ERROR \(|No rule to make|fatal error)" build.log | head -n 250 || true
            echo ""
            echo "----- 设备树相关 -----"
            grep -nE "(\.dts|\.dtb|dtc|dt-bindings)" build.log | tail -n 60 || true
            echo ""
            echo "----- 最后 100 行 -----"
            tail -n 100 build.log
            exit 1
          fi

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
          retention-days: 5
          if-no-files-found: ignore

      - name: 收集产物
        run: |
          mkdir -p out
          find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name "*pplink*" -o -name "*.manifest" -o -name "sha256sums" \) \
            -exec cp {} out/ \;
          ls -lh out

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pplink7981-firmware
          path: out/
          if-no-files-found: error

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PPLINK7981 build ${{ github.run_number }}
          files: out/*
