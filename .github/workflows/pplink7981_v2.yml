name: Build PPLINK7981 V2

# V2 只保留手动触发：不会因为任何 push 自动跑，避免和 V1 打架
on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget curl ccache \
            libelf-dev ecj fastjar java-propose-classpath time
          echo "nproc=$(nproc)  mem=$(free -m | awk '/Mem:/{print $2}')MB"

      - name: 克隆源码
        run: |
          git clone --depth=1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt && git log -1 --pretty='%h %s'

      - name: 注入设备
        run: |
          set -e
          cp mt7981b-pplink-7981.dts openwrt/target/linux/mediatek/dts/
          cat pplink-device.mk >> openwrt/target/linux/mediatek/image/filogic.mk
          install -Dm755 99-pplink-network \
            openwrt/target/linux/mediatek/filogic/base-files/etc/uci-defaults/99-pplink-network
          echo "--- 注入结果 ---"
          ls -l openwrt/target/linux/mediatek/dts/mt7981b-pplink-7981.dts
          tail -n 22 openwrt/target/linux/mediatek/image/filogic.mk

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置
        run: |
          cd openwrt
          cp ../pplink.config .config
          make defconfig
          grep -E "CONFIG_TARGET_mediatek_filogic_DEVICE_pplink_7981|CONFIG_TARGET_ROOTFS_SQUASHFS|CONFIG_PACKAGE_luci=" .config || true
          grep -q "CONFIG_TARGET_mediatek_filogic_DEVICE_pplink_7981=y" .config || {
            echo "::error::设备符号没生成，检查 filogic.mk 注入"; exit 1; }

      # 先预下载所有包源码（这一步最容易卡网络），单独成步便于定位
      # 注意：这里绝对不能接 `| tail -n N`，tail 不带 -f 会一直读到 EOF 才输出，页面又是一片空白
      - name: 预下载源码包
        run: |
          cd openwrt
          make -j1 download 2>&1 | tee download.log | grep --line-buffered -E \
            "^(Downloading|--|make\[|WARNING:)"
          echo "=== 下载完成，dl 总大小 ==="
          du -sh dl || true

      - name: 编译
        run: |
          cd openwrt
          set -o pipefail
          START=$(date +%s)

          # 后台心跳：每 3 分钟把「已耗时 + 最近日志尾巴 + 内存」打到页面上，
          # 这样即使 make 长时间无输出，也能一眼看出是真活着还是死了
          (
            while true; do
              sleep 180
              NOW=$(date +%s)
              echo "----- [心跳] 已编译 $(( (NOW-START)/60 ))m  内存 $(free -m | awk '/Mem:/{print $3"MB used / "$7"MB avail"}') -----"
              echo "----- 日志尾部：$(ls -l build.log 2>/dev/null | awk '{print $5" bytes"}') -----"
              tail -n 6 build.log 2>/dev/null | sed 's/^/    /'
            done
          ) &
          HB=$!
          trap "kill $HB 2>/dev/null || true" EXIT

          # 关键改动：不再 > build.log 静默，
          # 而是 tee 到文件 + grep 出「进展类」行实时刷到页面（make 递归入口 / 打包 / 安装）
          # make 的真实退出码用 PIPESTATUS 取，避免被 grep 掩盖
          make -j"$(nproc)" V=s 2>&1 | tee build.log | \
            grep --line-buffered -E "^(make\[[0-9]+\]: (Entering|Leaving) directory|Packaging|Installing|Configuring|Downloading|ERROR|.*Error [0-9])" || true
          RC=${PIPESTATUS[0]}

          echo "=== make 退出码: $RC ==="
          echo "=== 编译耗时: $(( ($(date +%s)-START)/60 )) 分钟 ==="

          if [ "$RC" -ne 0 ]; then
            echo "::error::编译失败，关键错误如下"
            echo "----- 错误行 -----"
            grep -nE "(\*\*\*|error:|Error [0-9]|undefined reference|Duplicate label|ERROR \(|No rule to make|fatal error)" build.log | head -n 250 || true
            echo "----- 设备树相关 -----"
            grep -nE "(\.dts|\.dtb|dtc|dt-bindings)" build.log | tail -n 60 || true
            echo "----- 最后 100 行 -----"
            tail -n 100 build.log
            exit 1
          fi
          echo "=== 编译成功 ==="
          tail -n 40 build.log

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            openwrt/build.log
            openwrt/download.log
          retention-days: 5
          if-no-files-found: ignore

      - name: 收集产物
        run: |
          mkdir -p out
          find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name "*pplink*" -o -name "*.manifest" -o -name "sha256sums" \) \
            -exec cp {} out/ \;
          ls -lh out

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pplink7981-firmware-v2
          path: out/
          if-no-files-found: error

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-v2-${{ github.run_number }}
          name: PPLINK7981 V2 build ${{ github.run_number }}
          files: out/*
